name: cliente_workflow
description: App cliente para gestión de consultas con el asesor

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # HTTP
  http: ^1.2.2

  # Local notifications (para mostrar push en background)
  flutter_local_notifications: ^17.2.3

  # Shared preferences (guardar consultaId localmente)
  shared_preferences: ^2.3.2

  # UI
  cupertino_icons: ^1.0.8

  # Selección de archivos e imágenes (paso formulario cliente)
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  http_parser: ^4.0.2

  # Consulta por voz con el agente IA
  record: ^5.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
