<div class="cabecera">
  <h1>Notificaciones</h1>
  <button mat-button color="primary" *ngIf="hayNoLeidas" (click)="marcarTodas()">
    <mat-icon>done_all</mat-icon> Marcar todas como leídas
  </button>
</div>

<div *ngIf="cargando" class="centrado"><mat-spinner diameter="32"></mat-spinner></div>

<p *ngIf="!cargando && notificaciones.length === 0" class="vacio">
  <mat-icon>notifications_off</mat-icon>
  No tienes notificaciones.
</p>

<div *ngFor="let n of notificaciones" class="noti" [class.no-leida]="!n.leida" (click)="abrir(n)">
  <mat-icon class="noti-icono">{{ icono(n.tipo) }}</mat-icon>
  <div class="noti-cuerpo">
    <span class="noti-titulo">{{ n.titulo }}</span>
    <span class="noti-texto">{{ n.cuerpo }}</span>
    <span class="noti-fecha">{{ n.creadaEn | date:'short' }}</span>
  </div>
  <span class="punto" *ngIf="!n.leida"></span>
  <button mat-icon-button (click)="eliminar(n, $event)" matTooltip="Eliminar">
    <mat-icon>delete</mat-icon>
  </button>
</div>
