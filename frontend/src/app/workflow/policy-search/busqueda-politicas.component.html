<div class="busqueda-container">

  <div class="busqueda-header">
    <div>
      <h1>Políticas Publicadas</h1>
      <p>Busca y consulta el detalle de cualquier política activa.</p>
    </div>
    <mat-form-field appearance="outline" class="campo-busqueda">
      <mat-label>Buscar por nombre</mat-label>
      <input matInput [formControl]="busqueda" placeholder="Ej: reconexión, solicitud...">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </div>

  <mat-progress-bar *ngIf="cargando" mode="indeterminate" class="barra-carga"></mat-progress-bar>

  <div *ngIf="sinResultados && !cargando" class="sin-resultados">
    <mat-icon>find_in_page</mat-icon>
    <p>No se encontraron políticas publicadas con ese criterio.</p>
  </div>

  <mat-table [dataSource]="politicas" *ngIf="!sinResultados" class="tabla-politicas mat-elevation-z2">

    <ng-container matColumnDef="nombre">
      <mat-header-cell *matHeaderCellDef>Nombre</mat-header-cell>
      <mat-cell *matCellDef="let p">
        <span class="nombre-politica">{{ p.nombre }}</span>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <mat-header-cell *matHeaderCellDef>Descripción</mat-header-cell>
      <mat-cell *matCellDef="let p">{{ p.descripcion || '—' }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="creadoPor">
      <mat-header-cell *matHeaderCellDef>Creado por</mat-header-cell>
      <mat-cell *matCellDef="let p">{{ p.creadoPor }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <mat-header-cell *matHeaderCellDef></mat-header-cell>
      <mat-cell *matCellDef="let p">
        <button mat-icon-button color="primary" (click)="verDetalle(p.id)" matTooltip="Ver detalle">
          <mat-icon>visibility</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="columnas"></mat-header-row>
    <mat-row *matRowDef="let row; columns: columnas;" class="fila-politica"
      (click)="verDetalle(row.id)"></mat-row>
  </mat-table>

</div>
