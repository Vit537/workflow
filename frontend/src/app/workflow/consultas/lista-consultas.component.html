<div class="consultas-container">
  <div class="header-row">
    <h2>Consultas de Clientes</h2>
    <button mat-raised-button color="primary" (click)="cargar()">
      <mat-icon>refresh</mat-icon> Actualizar
    </button>
  </div>

  <!-- Filtro por estado -->
  <mat-form-field appearance="outline" class="filtro-campo">
    <mat-label>Filtrar por estado</mat-label>
    <mat-select [(ngModel)]="filtroEstado" (selectionChange)="cambiarFiltro()">
      <mat-option *ngFor="let e of estados" [value]="e.valor">{{ e.etiqueta }}</mat-option>
    </mat-select>
  </mat-form-field>

  <div *ngIf="error" class="error-msg">{{ error }}</div>

  <ng-container *ngIf="consultas$ | async as consultas; else cargandoTpl">
    <div *ngIf="consultas.length === 0" class="vacio">
      No hay consultas para el filtro seleccionado.
    </div>

    <mat-card
      *ngFor="let c of consultas"
      class="consulta-card"
      (click)="verDetalle(c.id, c)"
    >
      <mat-card-header>
        <mat-card-title>{{ c.clienteNombre }}</mat-card-title>
        <mat-card-subtitle>
          <span [ngClass]="claseEstado(c.estado)" class="badge">
            {{ etiquetaEstado(c.estado) }}
          </span>
          &nbsp;·&nbsp;{{ c.creadaEn | date: 'dd/MM/yyyy HH:mm' }}
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ c.descripcion }}</p>
        <small *ngIf="c.clienteCorreo">{{ c.clienteCorreo }}</small>
        <small *ngIf="c.clienteTelefono">&nbsp;| {{ c.clienteTelefono }}</small>
      </mat-card-content>
    </mat-card>
  </ng-container>

  <ng-template #cargandoTpl>
    <div class="centro">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  </ng-template>

</div>
