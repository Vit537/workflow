# ─── Server ───────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── MongoDB ──────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/workflow_db}
spring.data.mongodb.database=workflow_db
spring.data.mongodb.auto-index-creation=true

# ─── JWT ──────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:3f6a9c2e1b8d4f7a0e5c3b9d6f2a8e1c4b7d0f3a6c9e2b5d8f1a4c7e0b3d6f9}
app.jwt.expiration-ms=86400000

# ─── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ─── Microservicio IA ─────────────────────────────────────────
ia.service.url=${IA_SERVICE_URL:http://localhost:8001}

# ─── Logs ─────────────────────────────────────────────────────
logging.level.com.workflow=INFO

# ─── Multipart (audio upload para reportes y archivos del cliente) ───
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# ─── Directorio de almacenamiento de archivos subidos por clientes ────
app.upload.dir=${UPLOAD_DIR:uploads}

# ─── Almacenamiento documental (abstracción local/S3) ─────────────────
# Tipo de almacenamiento: local | s3  (S3 pendiente para producción)
app.storage.type=${STORAGE_TYPE:local}
# Directorio base para almacenamiento local (por defecto reutiliza app.upload.dir)
app.storage.local.dir=${UPLOAD_DIR:uploads}
# (Producción) Configuración S3 — se usa solo cuando STORAGE_TYPE=s3
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:sa-east-1}

# ─── Co-edición en vivo (OnlyOffice Document Server) ──────────────────
# Activa/desactiva la integración. Si false, el sistema funciona igual que antes
# (no se ofrece edición en vivo y editableEnVivo=false).
app.onlyoffice.enabled=${ONLYOFFICE_ENABLED:true}
# URL pública que carga el NAVEGADOR para traer el editor (api.js).
app.onlyoffice.public-url=${ONLYOFFICE_PUBLIC_URL:http://localhost:8082}
# Base que usa el Document Server (Docker) para volver al backend del host.
# En Docker Desktop usar host.docker.internal; NO usar localhost (no llega al host).
app.onlyoffice.backend-base-url=${ONLYOFFICE_BACKEND_URL:http://host.docker.internal:8080}
# Secreto JWT compartido con el contenedor (= JWT_SECRET del docker-compose). Vacío = sin firma (solo dev).
app.onlyoffice.jwt-secret=${ONLYOFFICE_JWT_SECRET:un-secreto-compartido-con-el-contenedor}
# Vigencia (minutos) del token corto que firma las URLs de descarga/callback expuestas a OnlyOffice.
app.onlyoffice.callback-token-ttl-min=${ONLYOFFICE_TOKEN_TTL_MIN:120}
