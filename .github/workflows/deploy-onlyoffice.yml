name: Deploy OnlyOffice

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy-onlyoffice:
    name: Register task def & Deploy OnlyOffice
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── PASO 1: Verificar que todos los secrets esten configurados ─────────
      - name: Verify configuration
        env:
          ONLYOFFICE_JWT_SECRET: ${{ secrets.ONLYOFFICE_JWT_SECRET }}
          EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail
          echo "=== Verificando secrets ==="
          echo "AWS_REGION            : ${AWS_REGION:-(NO CONFIGURADO)}"
          echo "ONLYOFFICE_JWT_SECRET : $([ -n "$ONLYOFFICE_JWT_SECRET" ] && echo "SET (${#ONLYOFFICE_JWT_SECRET} chars)" || echo "NO CONFIGURADO")"
          echo "ECS_EXECUTION_ROLE_ARN: $([ -n "$EXECUTION_ROLE_ARN" ] && echo "SET (${#EXECUTION_ROLE_ARN} chars)" || echo "NO CONFIGURADO")"

          MISSING=0
          [ -z "$AWS_REGION" ]            && echo "ERROR: falta secret AWS_REGION"            && MISSING=1
          [ -z "$ONLYOFFICE_JWT_SECRET" ] && echo "ERROR: falta secret ONLYOFFICE_JWT_SECRET"  && MISSING=1
          [ -z "$EXECUTION_ROLE_ARN" ]    && echo "ERROR: falta secret ECS_EXECUTION_ROLE_ARN" && MISSING=1
          [ "$MISSING" -eq 1 ] && exit 1

          echo "=== Todos los secrets requeridos estan configurados ==="

      # ── PASO 2: Generar JSON y registrar Task Definition ──────────────────
      - name: Register OnlyOffice task definition
        env:
          ONLYOFFICE_JWT_SECRET: ${{ secrets.ONLYOFFICE_JWT_SECRET }}
          EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail

          # Usar Python para generar JSON (evita problemas de quoting/escaping con jq+bash)
          python3 - <<'PYEOF'
          import json, os, sys
          jwt_secret = os.environ.get("ONLYOFFICE_JWT_SECRET", "")
          exec_role  = os.environ.get("EXECUTION_ROLE_ARN", "")
          region     = os.environ.get("AWS_REGION", "")
          td = {
              "family": "workflow-onlyoffice-td",
              "networkMode": "awsvpc",
              "requiresCompatibilities": ["FARGATE"],
              "cpu": "2048",
              "memory": "4096",
              "executionRoleArn": exec_role,
              "containerDefinitions": [{
                  "name": "onlyoffice",
                  "image": "onlyoffice/documentserver:latest",
                  "essential": True,
                  "portMappings": [
                      {"containerPort": 80, "protocol": "tcp"},
                      {"containerPort": 443, "protocol": "tcp"}
                  ],
                  "environment": [
                      {"name": "JWT_ENABLED", "value": "true"},
                      {"name": "JWT_SECRET",  "value": jwt_secret},
                      {"name": "JWT_HEADER",  "value": "Authorization"}
                  ],
                  "logConfiguration": {
                      "logDriver": "awslogs",
                      "options": {
                          "awslogs-group":        "/ecs/workflow-onlyoffice",
                          "awslogs-region":        region,
                          "awslogs-stream-prefix": "onlyoffice",
                          "awslogs-create-group":  "true"
                      }
                  }
              }]
          }
          with open("/tmp/onlyoffice-td.json", "w") as f:
              json.dump(td, f, indent=2)
          size = os.path.getsize("/tmp/onlyoffice-td.json")
          print(f"JSON generado: {size} bytes  family={td['family']}  cpu={td['cpu']}  memory={td['memory']}")
          PYEOF

          echo "=== Registrando task definition en ECS ==="
          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/onlyoffice-td.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "Nueva task definition: $NEW_REVISION"
          echo "NEW_REVISION=$NEW_REVISION" >> "$GITHUB_ENV"

      # ── PASO 3: Actualizar el servicio ECS ────────────────────────────────
      - name: Deploy OnlyOffice to ECS
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster workflow-cluster \
            --service workflow-onlyoffice-svc \
            --task-definition "$NEW_REVISION" \
            --region "$AWS_REGION"

      - name: Summary
        run: |
          echo "### Deploy OnlyOffice completado" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Task definition:** \`$NEW_REVISION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Servicio:** \`workflow-onlyoffice-svc\`" >> "$GITHUB_STEP_SUMMARY"
