name: Deploy to Cloud Run

on:
  push:
    branches:
      - ciclo-3

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO: workflow-repo

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Backend Spring Boot
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ciclo-3
        uses: actions/checkout@v4
        with:
          ref: ciclo-3

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build backend image
        working-directory: backend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }} .

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }}

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy spring-service \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "MONGO_URI=${{ secrets.MONGO_URI }},JWT_SECRET=${{ secrets.JWT_SECRET }},CORS_ORIGINS=${{ secrets.FRONTEND_URL }}" \
            --project ${{ env.PROJECT_ID }}

      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe spring-service \
            --region ${{ env.REGION }} \
            --format='value(status.url)' \
            --project ${{ env.PROJECT_ID }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $URL"

    outputs:
      backend_url: ${{ steps.backend-url.outputs.url }}

  # ─────────────────────────────────────────────────────────────
  # JOB 2: AI Service Python
  # ─────────────────────────────────────────────────────────────
  deploy-ai-service:
    name: Build & Deploy AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ciclo-3
        uses: actions/checkout@v4
        with:
          ref: ciclo-3

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build AI service image
        working-directory: ai-service
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }} .

      - name: Push AI service image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }}

      - name: Deploy AI service to Cloud Run
        run: |
          gcloud run deploy ai-service \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},GROQ_MODEL=llama3-8b-8192,ALLOWED_ORIGINS=http://localhost:4200" \
            --project ${{ env.PROJECT_ID }}

      - name: Get AI service URL
        id: ai-url
        run: |
          URL=$(gcloud run services describe ai-service \
            --region ${{ env.REGION }} \
            --format='value(status.url)' \
            --project ${{ env.PROJECT_ID }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "AI Service URL: $URL"

    outputs:
      ai_url: ${{ steps.ai-url.outputs.url }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Frontend Angular
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    steps:
      - name: Checkout ciclo-3
        uses: actions/checkout@v4
        with:
          ref: ciclo-3

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Patch API URLs in Angular services
        working-directory: frontend
        run: |
          BACKEND_URL="${{ needs.deploy-backend.outputs.backend_url }}"
          find src/app/shared/services -name "*.ts" \
            -exec sed -i "s|http://localhost:8080|$BACKEND_URL|g" {} \;

      - name: Build frontend image
        working-directory: frontend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/angular-frontend:${{ github.sha }} .

      - name: Push frontend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/angular-frontend:${{ github.sha }}

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy angular-frontend \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/angular-frontend:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy summary
        run: |
          echo ""
          echo "=========================================="
          echo "   DEPLOY COMPLETO"
          echo "=========================================="
          echo "  Frontend:   ${{ secrets.FRONTEND_URL }}"
          echo "  Backend:    ${{ needs.deploy-backend.outputs.backend_url }}"
          echo "=========================================="

      - name: Update AI service CORS (best-effort)
        continue-on-error: true
        run: |
          FRONTEND_URL=$(gcloud run services describe angular-frontend \
            --region ${{ env.REGION }} \
            --format='value(status.url)' \
            --project ${{ env.PROJECT_ID }})
          gcloud run services update ai-service \
            --region ${{ env.REGION }} \
            --update-env-vars "ALLOWED_ORIGINS=$FRONTEND_URL" \
            --project ${{ env.PROJECT_ID }}
