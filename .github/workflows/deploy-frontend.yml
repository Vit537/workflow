name: Deploy Frontend

on:
  push:
    branches:
      - primeros-cambios
    paths:
      - 'frontend/**'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO: workflow-repo
  BACKEND_URL: https://spring-service-983013859583.us-central1.run.app

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout primeros-cambios
        uses: actions/checkout@v4
        with:
          ref: primeros-cambios

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Patch API URLs in Angular services
        working-directory: frontend
        run: |
          find src/app/shared/services -name "*.ts" \
            -exec sed -i "s|http://localhost:8080|${{ env.BACKEND_URL }}|g" {} \;

      - name: Build frontend image
        working-directory: frontend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/angular-frontend:${{ github.sha }} .

      - name: Push frontend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/angular-frontend:${{ github.sha }}

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy angular-frontend \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/angular-frontend:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy summary
        run: |
          echo "=========================================="
          echo "  Frontend: ${{ secrets.FRONTEND_URL }}"
          echo "=========================================="
