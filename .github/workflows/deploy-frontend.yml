name: Deploy Frontend

on:
  push:
    branches:
      - ciclo-4
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg BACKEND_URL=${{ secrets.BACKEND_ALB_URL }} \
            -t $ECR_REGISTRY/workflow/frontend:${{ github.sha }} ./frontend
          docker tag $ECR_REGISTRY/workflow/frontend:${{ github.sha }} $ECR_REGISTRY/workflow/frontend:latest
          docker push $ECR_REGISTRY/workflow/frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/workflow/frontend:latest

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster workflow-cluster \
            --service workflow-frontend-svc \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Summary
        run: |
          echo "### Deploy Frontend completado ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagen:** \`$ECR_REGISTRY/workflow/frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY