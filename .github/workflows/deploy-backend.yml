name: Deploy Backend & AI Service

on:
  push:
    branches:
      - ciclo-3
    paths:
      - 'backend/**'
      - 'ai-service/**'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO: workflow-repo

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Backend Spring Boot
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ciclo-3
        uses: actions/checkout@v4
        with:
          ref: ciclo-3

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build backend image
        working-directory: backend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }} .

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }}

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy spring-service \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "MONGO_URI=${{ secrets.MONGO_URI }},JWT_SECRET=${{ secrets.JWT_SECRET }},CORS_ORIGINS=${{ secrets.FRONTEND_URL }}" \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy summary
        run: |
          echo "=========================================="
          echo "  Backend: https://spring-service-983013859583.us-central1.run.app"
          echo "=========================================="

  # ─────────────────────────────────────────────────────────────
  # JOB 2: AI Service Python
  # ─────────────────────────────────────────────────────────────
  deploy-ai-service:
    name: Build & Deploy AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ciclo-3
        uses: actions/checkout@v4
        with:
          ref: ciclo-3

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build AI service image
        working-directory: ai-service
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }} .

      - name: Push AI service image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }}

      - name: Deploy AI service to Cloud Run
        run: |
          gcloud run deploy ai-service \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},GROQ_MODEL=llama3-8b-8192,ALLOWED_ORIGINS=${{ secrets.FRONTEND_URL }}" \
            --project ${{ env.PROJECT_ID }}
