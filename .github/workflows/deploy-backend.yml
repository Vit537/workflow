name: Deploy Backend & AI Service

on:
  push:
    branches:
      - ultimos-cambios
    paths:
      - 'backend/**'
      - 'ai-service/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO: workflow-repo

jobs:
  deploy-ai-service:
    name: Build & Deploy AI Service
    runs-on: ubuntu-latest

    outputs:
      ai_url: ${{ steps.ai-url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ultimos-cambios

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build AI service image
        working-directory: ai-service
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }} .

      - name: Push AI service image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }}

      - name: Deploy AI service to Cloud Run
        run: |
          gcloud run deploy ai-service \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --cpu-boost \
            --set-env-vars "GROQ_API_KEY_POLICY=${{ secrets.GROQ_API_KEY_POLICY }},GROQ_API_KEY_CHAT=${{ secrets.GROQ_API_KEY_CHAT }},GROQ_MODEL=llama-3.1-8b-instant,ALLOWED_ORIGINS=${{ secrets.FRONTEND_URL }}" \
            --project ${{ env.PROJECT_ID }}

      - name: Get AI service URL
        id: ai-url
        run: |
          URL=$(gcloud run services describe ai-service \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format "value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT

  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    needs: deploy-ai-service

    outputs:
      backend_url: ${{ steps.backend-url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ultimos-cambios

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Write Firebase credentials
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_ADMINSDK_JSON }}
        run: |
          printf '%s' "$FIREBASE_JSON" > backend/src/main/resources/firebase-adminsdk.json

      - name: Build backend image
        working-directory: backend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }} .

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }}

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy spring-service \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --cpu-boost \
            --set-env-vars "MONGO_URI=${{ secrets.MONGO_URI }},JWT_SECRET=${{ secrets.JWT_SECRET }},CORS_ORIGINS=${{ secrets.FRONTEND_URL }},IA_SERVICE_URL=${{ needs.deploy-ai-service.outputs.ai_url }}" \
            --project ${{ env.PROJECT_ID }}

      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe spring-service \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format "value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "### Deploy completado" >> $GITHUB_STEP_SUMMARY
          echo "- **AI Service:** ${{ needs.deploy-ai-service.outputs.ai_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** ${{ steps.backend-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY