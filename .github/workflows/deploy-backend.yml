name: Deploy Backend & AI Service

on:
  push:
    branches:
      - primeros-cambios
    paths:
      - 'backend/**'
      - 'ai-service/**'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO: workflow-repo

jobs:
  deploy-backend:
    name: Build & Deploy Backend + AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: primeros-cambios

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # ── AI Service ─────────────────────────────────────────────
      - name: Build AI service image
        working-directory: ai-service
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }} .

      - name: Push AI service image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }}

      - name: Deploy AI service to Cloud Run
        run: |
          gcloud run deploy ai-service \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-service:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},GROQ_MODEL=llama-3.1-8b-instant,ALLOWED_ORIGINS=https://angular-frontend-468909365212.us-central1.run.app" \
            --project ${{ env.PROJECT_ID }}

      - name: Get AI service URL
        id: ai-url
        run: |
          URL=$(gcloud run services describe ai-service \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format "value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "AI Service URL: $URL"

      # ── Backend Spring Boot ────────────────────────────────────
      - name: Build backend image
        working-directory: backend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }} .

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }}

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy spring-service \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/spring-service:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "MONGO_URI=${{ secrets.MONGO_URI }},JWT_SECRET=${{ secrets.JWT_SECRET }},CORS_ORIGINS=https://angular-frontend-468909365212.us-central1.run.app,IA_SERVICE_URL=${{ steps.ai-url.outputs.url }}" \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy summary
        run: |
          echo "=========================================="
          echo "  AI Service: ${{ steps.ai-url.outputs.url }}"
          echo "  Backend:    https://spring-service-468909365212.us-central1.run.app"
          echo "=========================================="
