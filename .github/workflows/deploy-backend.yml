name: Deploy Backend & AI Service

on:
  push:
    branches:
      - ft-ciclo4-new
    paths:
      - 'backend/**'
      - 'ai-service/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  BACKEND_TASK_DEF: workflow-backend-td   # nombre de la Task Definition en ECS

jobs:
  deploy-ai-service:
    name: Build & Deploy AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push AI service image
        run: |
          docker build -t $ECR_REGISTRY/workflow/ai-service:${{ github.sha }} ./ai-service
          docker tag $ECR_REGISTRY/workflow/ai-service:${{ github.sha }} $ECR_REGISTRY/workflow/ai-service:latest
          docker push $ECR_REGISTRY/workflow/ai-service:${{ github.sha }}
          docker push $ECR_REGISTRY/workflow/ai-service:latest

      - name: Deploy AI service to ECS
        run: |
          aws ecs update-service \
            --cluster workflow-cluster \
            --service workflow-ai-svc \
            --force-new-deployment \
            --region $AWS_REGION

  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    needs: deploy-ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Write Firebase credentials
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_ADMINSDK_JSON }}
        run: |
          printf '%s' "$FIREBASE_JSON" > backend/src/main/resources/firebase-adminsdk.json

      - name: Build and push backend image
        run: |
          docker build -t $ECR_REGISTRY/workflow/backend:${{ github.sha }} ./backend
          docker tag $ECR_REGISTRY/workflow/backend:${{ github.sha }} $ECR_REGISTRY/workflow/backend:latest
          docker push $ECR_REGISTRY/workflow/backend:${{ github.sha }}
          docker push $ECR_REGISTRY/workflow/backend:latest

      - name: Deploy backend to ECS
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          ONLYOFFICE_PUBLIC_URL: ${{ secrets.ONLYOFFICE_PUBLIC_URL }}
          ONLYOFFICE_BACKEND_URL: ${{ secrets.ONLYOFFICE_BACKEND_URL }}
          ONLYOFFICE_JWT_SECRET: ${{ secrets.ONLYOFFICE_JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          # 1) Obtener task definition actual y limpiar campos no registrables
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $BACKEND_TASK_DEF \
            --query "taskDefinition" \
            --output json | \
            jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.placementConstraints,.compatibilities,.registeredAt,.registeredBy)')

          # 2) Inyectar / actualizar variables de entorno en el contenedor
          UPDATED=$(echo "$TASK_DEF" | jq \
            --arg img "$ECR_REGISTRY/workflow/backend:${{ github.sha }}" \
            --arg s3bucket  "$S3_BUCKET" \
            --arg oo_pub    "$ONLYOFFICE_PUBLIC_URL" \
            --arg oo_back   "$ONLYOFFICE_BACKEND_URL" \
            --arg oo_secret "$ONLYOFFICE_JWT_SECRET" \
            --arg cors      "$CORS_ORIGINS" \
            '
            .containerDefinitions[0].image = $img |
            .containerDefinitions[0].environment = (
              (.containerDefinitions[0].environment // []) |
              map(select(.name | IN(
                "STORAGE_TYPE","S3_BUCKET","S3_REGION",
                "ONLYOFFICE_ENABLED","ONLYOFFICE_PUBLIC_URL",
                "ONLYOFFICE_BACKEND_URL","ONLYOFFICE_JWT_SECRET",
                "CORS_ORIGINS"
              ) | not)) +
              [
                {"name":"STORAGE_TYPE",            "value":"s3"},
                {"name":"S3_BUCKET",               "value":$s3bucket},
                {"name":"S3_REGION",               "value":"sa-east-1"},
                {"name":"ONLYOFFICE_ENABLED",       "value":"true"},
                {"name":"ONLYOFFICE_PUBLIC_URL",    "value":$oo_pub},
                {"name":"ONLYOFFICE_BACKEND_URL",   "value":$oo_back},
                {"name":"ONLYOFFICE_JWT_SECRET",    "value":$oo_secret},
                {"name":"CORS_ORIGINS",             "value":$cors}
              ]
            )')

          # 3) Registrar nueva revisión
          NEW_REVISION=$(echo "$UPDATED" | aws ecs register-task-definition \
            --cli-input-json file:///dev/stdin \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "Nueva task definition: $NEW_REVISION"

          # 4) Actualizar el servicio con la nueva revisión
          aws ecs update-service \
            --cluster workflow-cluster \
            --service workflow-backend-service-8xmfry08 \
            --task-definition "$NEW_REVISION" \
            --region $AWS_REGION

      - name: Summary
        run: |
          echo "### Deploy completado ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **AI Service:** imagen \`$ECR_REGISTRY/workflow/ai-service:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** imagen \`$ECR_REGISTRY/workflow/backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY